name: rvpa
description: "RVPA - aplikasi pendamping rutinitas skincare (Final Project Tekber Kelompok 5)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  # Font Playfair Display (judul) dan Poppins (isi), sesuai desain Figma
  google_fonts: ^6.2.1
  # Ambil foto dari kamera / galeri (foto produk, foto profil, scan wajah)
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
